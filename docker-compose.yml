services:
  pg-ordenes:
    image: postgres:16
    container_name: pg-ordenes
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketseats_ordenes
    ports: ["5437:5432"]
    volumes:
      - pgdata_ordenes:/var/lib/postgresql/data
      - ./sql/ordenes.sql:/docker-entrypoint-initdb.d/01-ordenes.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  ms-ordenes:
    build: .
    container_name: ms-ordenes
    restart: on-failure
    environment:
      JWT_SECRET: cambia-esto-en-produccion
      DATABASE_URL: postgresql://postgres:postgres@pg-ordenes:5432/ticketseats_ordenes
      EVENTOS_URL: http://host.docker.internal:8002
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["8003:8003"]
    depends_on:
      pg-ordenes: { condition: service_healthy }

volumes:
  pgdata_ordenes:
